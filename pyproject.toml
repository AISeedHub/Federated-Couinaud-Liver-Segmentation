[project]
name = "couinaudfl"
version = "0.1.0"
description = "Federated learning for nine-segment Couinaud liver segmentation (nnU-Net-style backbone, TotalSegmentator init)"
requires-python = ">=3.10"
# torch/torchvision은 의도적으로 제외: 각 머신의 CUDA에 맞춰 scripts/install.* 가 설치한다.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5.0",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "opencv-python-headless>=4.8",
  "monai>=1.3",
  "flwr>=1.11,<1.12",
  "dynamic-network-architectures>=0.3",
  "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["couinaudfl*"]
